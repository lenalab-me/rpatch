[package]
name = "rpatch"
version = "0.13.0"
edition = "2024"
rust-version = "1.88"

[features]
default = []
# `rpatch mcp`: a local MCP server over stdio (docs/mcp.md)
mcp = ["dep:rmcp", "dep:tokio"]

[dependencies]
rmcp = { version = "3.5.0", default-features = false, features = ["server", "macros", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
strsim = "0.11.1"
tempfile = "3.27.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
