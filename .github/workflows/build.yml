name: Build and test
# Manual only: run it with `gh workflow run build.yml` when release binaries are needed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            binary: rpatch
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: rpatch
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: rpatch.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features mcp -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features mcp
      # The artifacts include MCP so they work with Codex and Claude Code as downloaded.
      - run: cargo build --locked --release --features mcp --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: rpatch-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
  # The oldest Rust that `rust-version` in Cargo.toml promises (a test keeps the two equal).
  msrv:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo test --locked
      - run: cargo test --locked --features mcp
